<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bujji, opened up</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ece4;--fg:#1b1410;--mut:#6b5b4e;--acc:#e8620c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--d:2.5s;--ps:running}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f12;--fg:#f2ece6;--mut:#9a8e84;--acc:#ff8a2a}}
:root[data-theme="dark"]{--bg:#0d0f12;--fg:#f2ece6;--mut:#9a8e84;--acc:#ff8a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Chakra Petch',system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:22px 16px 28px}
h1{font-size:clamp(28px,5vw,46px);margin:0 0 6px;font-weight:600;letter-spacing:-.01em}
p.lead{margin:0 0 16px;color:var(--mut);max-width:60ch;line-height:1.5}
.stage{border-radius:14px;overflow:hidden;background:#07111a;box-shadow:0 18px 50px rgba(0,0,0,.35)}
svg{display:block;width:100%;height:auto;touch-action:pan-y;cursor:ew-resize;user-select:none}
.row{display:flex;gap:14px;align-items:center;margin-top:14px;flex-wrap:wrap}
label{font-weight:600}
input[type=range]{flex:1;min-width:160px;max-width:360px;accent-color:var(--acc)}
small{color:var(--mut);display:block;margin-top:12px}
.spin{transform-origin:0 0;animation:spin var(--d) linear infinite;animation-play-state:var(--ps)}
.flow{stroke-dasharray:6 8;animation:flow var(--d) linear infinite;animation-play-state:var(--ps)}
.bob{animation:bob var(--d) ease-in-out infinite;animation-play-state:var(--ps)}
.road{stroke-dasharray:40 30;animation:road var(--d) linear infinite;animation-play-state:var(--ps)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes road{to{stroke-dashoffset:70}}
#hd:focus-visible circle{stroke:#ffd21f;stroke-width:4}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main>
<h1>Bujji, opened up</h1>
<p class="lead">Drag the line across the car. Left of it is what drives the wheels, right of it is the shell.</p>
<div class="stage"><svg id="s" viewBox="0 0 1000 560" role="img" aria-label="Bujji vehicle with a draggable cutaway divider">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1a2e"/><stop offset=".6" stop-color="#b8532a"/><stop offset="1" stop-color="#f0a04a"/></linearGradient>
<linearGradient id="og" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa447"/><stop offset="1" stop-color="#e05a0a"/></linearGradient>
<linearGradient id="yg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe752"/><stop offset="1" stop-color="#eeb000"/></linearGradient>
<linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a323b"/><stop offset=".5" stop-color="#0c0f13"/><stop offset="1" stop-color="#1b2128"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5ee7ff" stroke-opacity=".08"/></pattern>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6L6 0" stroke="#3b3f45" stroke-width="2"/></pattern>
<clipPath id="c"><rect id="cr" x="0" y="0" width="500" height="560"/></clipPath>
</defs>
<g id="ext"></g>
<g id="xr" clip-path="url(#c)"></g>
<g id="hd" role="slider" tabindex="0" aria-label="Reveal the machine" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
<line y1="0" y2="560" stroke="#fff" stroke-width="2"/><circle cy="280" r="22" fill="#0b1219" stroke="#fff" stroke-width="2.5"/>
<path d="M-4 271l-9 9 9 9M4 271l9 9-9 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg></div>
<div class="row"><label for="t">Throttle</label><input id="t" type="range" min="0" max="100" value="45"></div>
<small>Fan-made cutaway of the Kalki 2898 AD vehicle. The internals are imagined.</small>
</main>
<script>
const C='#5ee7ff',Y='#ffd21f';
const B='M245 322C275 272 395 262 480 280L690 296C745 306 772 335 762 372L700 392L440 402C365 406 290 392 245 352Z';
const K='M395 298C440 236 600 222 715 300C640 290 480 288 395 298Z';
const R='M118 296L262 280L275 350L128 372Z';
const FA='M430 392L700 388L742 370L770 408L712 442L470 436Z';
const RA='M140 408L330 398L352 424L160 442Z';
function spokes(r){let s='';for(let i=0;i<5;i++){const a=i*1.2566;s+=`<line x2="${(r*.58*Math.cos(a)).toFixed(1)}" y2="${(r*.58*Math.sin(a)).toFixed(1)}"/>`}return s}
function wheel(x,y,r,xr){const sp=spokes(r);
return xr?`<g transform="translate(${x} ${y})" fill="none" stroke="${C}" stroke-width="1.4"><circle r="${r}"/><circle r="${r*.62}" opacity=".6"/><g class="spin" stroke-width="2">${sp}<circle r="${r*.58}" stroke-dasharray="4 6" opacity=".7"/></g><circle r="${r*.14}" fill="${C}"/></g>`
:`<g transform="translate(${x} ${y})"><circle r="${r}" fill="#25282d"/><g class="spin"><circle r="${r-6}" fill="none" stroke="#585c63" stroke-width="10" stroke-dasharray="9 7"/></g><circle r="${r*.66}" fill="#8e939a"/><circle r="${r*.56}" fill="#2f3237"/><g class="spin" stroke="#cfd3d8" stroke-width="5" stroke-linecap="round">${sp}</g><circle r="${r*.14}" fill="#e6e8ea"/></g>`}
function lab(x,y,tx,ty,t){return `<path d="M${x} ${y}L${tx} ${ty-(ty<300?-14:14)}" stroke="#bff6ff" stroke-opacity=".7"/><circle cx="${x}" cy="${y}" r="3.5" fill="#bff6ff"/><text x="${tx}" y="${ty}" text-anchor="middle" fill="#bff6ff" font-size="15" font-family="Chakra Petch,sans-serif">${t}</text>`}
document.getElementById('ext').innerHTML=`
<rect width="1000" height="560" fill="url(#sky)"/><circle cx="740" cy="330" r="120" fill="#ffd89a" opacity=".35"/>
<path d="M0 400L110 340L220 392L360 322L520 396L690 330L850 392L1000 340V470H0Z" fill="#3a2118" opacity=".8"/>
<rect y="456" width="1000" height="104" fill="#1c120d"/><line x1="0" x2="1000" y1="500" y2="500" stroke="#7a5238" stroke-width="3" class="road"/>
<ellipse cx="490" cy="458" rx="380" ry="12" fill="#000" opacity=".4"/>
${wheel(205,388,68)}
<path d="${RA}" fill="url(#yg)" stroke="#8a6500" stroke-width="2"/><path d="${R}" fill="#15181c"/><path d="M135 312L255 298M137 330L260 316" stroke="#3a3f46" stroke-width="3"/>
<path d="${B}" fill="url(#og)" stroke="#a63f00" stroke-width="2.5"/><path d="M300 300C360 284 440 286 500 298" stroke="#ffd7a0" stroke-width="3" fill="none" opacity=".6"/>
<path d="${FA}" fill="url(#yg)" stroke="#8a6500" stroke-width="2.5"/><path d="M485 408L650 398" stroke="#e1e4e8" stroke-width="7" stroke-linecap="round"/><path d="M485 408L650 398" stroke="#7d8289" stroke-width="2" stroke-linecap="round"/>
<circle cx="455" cy="362" r="54" fill="#ff8a2a" stroke="#b84c06" stroke-width="3"/><circle cx="455" cy="362" r="32" fill="#ffab55" stroke="#c9560a" stroke-width="2"/><circle cx="455" cy="362" r="10" fill="#2a1408"/>
<path d="M350 258L410 250L422 282L360 292Z" fill="#8a8e95"/><path d="M350 258L410 250L422 282L360 292Z" fill="url(#hatch)"/>
<path d="${K}" fill="url(#cg)" stroke="#05070a" stroke-width="2"/><path d="M445 262C505 236 595 238 655 272" stroke="#fff" stroke-opacity=".28" stroke-width="3" fill="none" stroke-linecap="round"/>
${wheel(800,372,84)}
<text x="976" y="44" text-anchor="end" fill="#fff" fill-opacity=".85" font-size="20" font-weight="600" font-family="Chakra Petch,sans-serif">Outside</text>`;
document.getElementById('xr').innerHTML=`
<rect width="1000" height="560" fill="#07111a"/><rect width="1000" height="560" fill="url(#grid)"/>
<line x1="0" x2="1000" y1="456" y2="456" stroke="${C}" stroke-opacity=".5"/><line x1="0" x2="1000" y1="500" y2="500" stroke="${C}" stroke-opacity=".35" class="road"/>
<g fill="rgba(94,231,255,.05)" stroke="${C}" stroke-width="1.5"><path d="${B}"/><path d="${K}"/><path d="${R}"/><path d="${FA}" opacity=".6"/><path d="${RA}" opacity=".6"/></g>
${wheel(205,388,68,1)}${wheel(800,372,84,1)}
<g stroke="${Y}" fill="rgba(255,210,31,.1)" stroke-width="1.6"><rect x="300" y="374" width="300" height="24" rx="6"/>${[330,360,390,420,450,480,510,540,570].map(x=>`<line x1="${x}" x2="${x}" y1="374" y2="398"/>`).join('')}</g>
<path d="M300 386L600 386" stroke="${Y}" stroke-width="3" class="flow" fill="none"/>
<path d="M455 362L205 388" stroke="${C}" stroke-width="3" class="flow" fill="none"/>
<path d="M600 386L716 386L800 372" stroke="${Y}" stroke-width="3" class="flow" fill="none"/>
<g transform="translate(455 362)" fill="none" stroke="${C}" stroke-width="1.6"><circle r="54"/><circle r="32" stroke-dasharray="3 5"/>
<g class="spin" stroke="${Y}" stroke-width="3" stroke-linecap="round">${[0,1,2,3,4,5].map(i=>`<line x1="${(12*Math.cos(i*1.0472)).toFixed(1)}" y1="${(12*Math.sin(i*1.0472)).toFixed(1)}" x2="${(44*Math.cos(i*1.0472+.5)).toFixed(1)}" y2="${(44*Math.sin(i*1.0472+.5)).toFixed(1)}"/>`).join('')}</g><circle r="6" fill="${Y}"/></g>
<g transform="translate(800 372)" fill="none" stroke="${Y}" stroke-width="2"><circle r="30"/><g class="spin" stroke-dasharray="3 7"><circle r="22"/></g></g>
<g stroke="${C}" stroke-width="1.6" fill="none"><rect x="634" y="338" width="12" height="52" rx="3" fill="rgba(94,231,255,.12)"/><path d="M640 300V330" class="bob" stroke="#fff" stroke-width="4"/><path d="M628 338l24 0M640 392l0 0" opacity="0"/></g>
<g stroke="${C}" stroke-width="1.8" fill="none"><rect x="362" y="302" width="46" height="30" rx="3" fill="rgba(94,231,255,.12)"/>${[0,1,2,3].map(i=>`<path d="M${370+i*10} 302v-7M${370+i*10} 332v7"/>`).join('')}</g>
<g stroke="${C}" stroke-width="1.4" fill="none" stroke-dasharray="5 4" opacity=".8"><circle cx="545" cy="268" r="14"/><path d="M545 282C552 300 575 306 600 304M545 282C536 296 520 304 505 306"/></g>
${lab(385,302,330,150,'Control brain')}${lab(455,340,470,150,'Rotor core')}${lab(640,300,625,150,'Hydraulic strut')}${lab(800,342,810,150,'Hub motor')}${lab(520,398,520,516,'Battery spine')}${lab(330,376,290,516,'Drive shaft')}
<text x="24" y="44" fill="#fff" fill-opacity=".85" font-size="20" font-weight="600" font-family="Chakra Petch,sans-serif">Inside</text>`;
const s=document.getElementById('s'),cr=document.getElementById('cr'),hd=document.getElementById('hd');let x=500,raf=0;
function set(v){x=Math.max(30,Math.min(970,v));cr.setAttribute('width',x);hd.setAttribute('transform',`translate(${x} 0)`);hd.setAttribute('aria-valuenow',Math.round(x/10))}
function at(e){const r=s.getBoundingClientRect();return(e.clientX-r.left)/r.width*1000}
let drag=0;s.addEventListener('pointerdown',e=>{cancelAnimationFrame(raf);drag=1;s.setPointerCapture(e.pointerId);set(at(e))});
s.addEventListener('pointermove',e=>{if(drag)set(at(e))});s.addEventListener('pointerup',()=>drag=0);s.addEventListener('pointercancel',()=>drag=0);
hd.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){set(x-30);e.preventDefault()}if(e.key==='ArrowRight'){set(x+30);e.preventDefault()}});
const rs=document.documentElement.style;document.getElementById('t').addEventListener('input',e=>{const v=+e.target.value;rs.setProperty('--ps',v?'running':'paused');rs.setProperty('--d',(4.2-v*.037).toFixed(2)+'s')});
set(960);
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){const t0=performance.now();(function f(n){const p=Math.min(1,(n-t0-500)/1800);if(p>0)set(960-460*(1-Math.pow(1-p,3)));if(p<1)raf=requestAnimationFrame(f);else raf=0;if(p<=0)raf=requestAnimationFrame(f)})(t0)}else set(500);
</script></body></html>
